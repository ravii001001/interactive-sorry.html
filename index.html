<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }
  .hearts-bg, .balloons-bg {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 1; overflow: hidden;
  }
  .heart, .balloon {
    position: absolute;
    animation: fall linear infinite;
    opacity: 0.75;
  }
  .balloon {
    font-size: 14px; font-weight: 600;
    color: #e91e63;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
  .container {
    text-align: center;
    background: rgba(255,255,255,0.97);
    padding: 28px 20px;
    border-radius: 28px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.13);
    max-width: 400px; width: 100%;
    position: relative; z-index: 10;
  }
  .photo {
    width: 125px; height: 125px;
    border-radius: 50%; object-fit: cover;
    border: 4px solid #e91e63;
    box-shadow: 0 8px 20px rgba(233,30,99,0.3);
    margin-bottom: 14px;
  }
  h1 { color: #e91e63; font-size: 23px; margin-bottom: 10px; }
  #message {
    color: #444; font-size: 15px;
    margin-bottom: 12px; line-height: 1.5; min-height: 48px;
  }
  #rejectText {
    background: #ffe6ee;
    color: #e91e63;
    font-size: 16px; font-weight: 700;
    padding: 8px 16px; border-radius: 50px;
    display: none;
    margin: 8px 0 14px;
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  button {
    padding: 12px 20px; font-size: 15px;
    border: none; border-radius: 50px;
    cursor: pointer; font-weight: 600;
    color: white; background: #e91e63;
  }
  button:hover { background: #c2185b; }
  #no { position: relative; }
  .hidden { display: none !important; }
  .reaction {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 65px; z-index: 9999;
    pointer-events: none;
    animation: pop 1.2s ease forwards;
  }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    30%  { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
    70%  { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -65%) scale(0.6); opacity: 0; }
  }
  .confetti {
    position: fixed;
    width: 10px; height: 10px;
    top: -10px;
    z-index: 999;
    animation: confettiFall 3s linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="hearts-bg" id="heartsBg"></div>
  <div class="balloons-bg" id="balloonsBg"></div>

  <audio id="sadMusic" loop>
    <source src="https://raw.githubusercontent.com/ravii001001/interactive-sorry.html/main/voicee.mp3" type="audio/mpeg">
  </audio>
  <audio id="romanticMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <div class="container" id="main">
    <img src="https://raw.githubusercontent.com/ravii001001/interactive-sorry.html/main/shreya.jpeg" class="photo" alt="Her">
   <img src="https://raw.githubusercontent.com/ravii001001/interactive-sorry.html/main/ravi.jpeg" class="photo" alt="Her">
   <h1>Baby... 🥺</h1>
    <p id="message">Maile galti gare, maaf gara na.<br>Timi risako dekhera mann dukhiraxa.</p>

    <div id="rejectText"></div>

    <div class="buttons">
      <button id="yes">Sorry accepted❤️</button>
      <button id="no">Sorry not accepted</button>
    </div>
  </div>

  <div class="container hidden" id="love">
    <h1 id="loveTitle">I Love You So Much 💕</h1>
    <p id="loveMessage"></p>
  </div>

<script>
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const main = document.getElementById('main');
  const love = document.getElementById('love');
  const message = document.getElementById('message');
  const rejectText = document.getElementById('rejectText');
  const heartsBg = document.getElementById('heartsBg');
  const balloonsBg = document.getElementById('balloonsBg');
  const sadMusic = document.getElementById('sadMusic');
  const romanticMusic = document.getElementById('romanticMusic');
  const loveTitle = document.getElementById('loveTitle');
  const loveMessage = document.getElementById('loveMessage');

  let rejects = 0;

  const messages = [
    "Maile galti gare, maaf gara na.<br>Timi risako dekhera mann dukhiraxa.",
    "Please forgive me baby 🥺<br>Maile timilai dukha diyeko maile maaf chahanchu.",
    "I'm really sorry... 💔<br>Timro mann dukhauna maile chahena.",
    "Maile galti gare, sachi ma 😭<br>Please ek choti maaf gara na.",
    "Timi bina ma incomplete chu 😢<br>Please risai narakha na.",
    "Jati choti reject garda pani<br>maile sorry nai bhanirahanchu 🥺",
    "Baby please... maaf gara na 💔<br>Ma feri galti gardina.",
    "Timro muskan nai mero happiness ho.<br>Please forgive me 😢",
    "Last time... please maaf gara 😭❤️",
    "Maile sabai galti accept garchu.<br>Please ek chance deu na 🥺"
  ];

  const reactions = ["💔😢","😭💔","💔🥺","😢💔😭","🖤😭","💔😩","😭🖤","💔😿"];
  const heartStyles = ["❤️","💖","💕","💗","💓","💘","💝","🖤","💔","✨"];
  const balloonTexts = ["I ❤️ You", "Sorry 🥺", "Maaf gara","please shreyaa","Forgive me", "Love you"];

  setInterval(() => {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = heartStyles[Math.floor(Math.random()*heartStyles.length)];
    heart.style.left = Math.random()*100 + 'vw';
    heart.style.fontSize = (Math.random()*12 + 14) + 'px';
    heart.style.animationDuration = (Math.random()*4 + 3) + 's';
    heartsBg.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }, 400);

  setInterval(() => {
    const b = document.createElement('div');
    b.classList.add('balloon');
    b.innerHTML = balloonTexts[Math.floor(Math.random()*balloonTexts.length)];
    b.style.left = Math.random()*100 + 'vw';
    b.style.animationDuration = (Math.random()*5 + 4) + 's';
    balloonsBg.appendChild(b);
    setTimeout(() => b.remove(), 9000);
  }, 1200);

  function playMusic(type) {
    sadMusic.pause();
    romanticMusic.pause();

    if (type === 'sad') {
      sadMusic.currentTime = 0;
      sadMusic.volume = 0.45;
      sadMusic.play().catch(()=>{});
    } else {
      romanticMusic.currentTime = 0;
      romanticMusic.volume = 0.5;
      romanticMusic.play().catch(()=>{});
    }
  }

  function showReaction() {
    const el = document.createElement('div');
    el.className = 'reaction';
    el.innerHTML = reactions[Math.floor(Math.random()*reactions.length)];
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }

  function moveButton() {
    noBtn.style.transition = '0.1s';
    noBtn.style.transform = 'translateX(-8px)';
    setTimeout(() => noBtn.style.transform = 'translateX(8px)', 80);
    setTimeout(() => noBtn.style.transform = 'translateX(-5px)', 160);
    setTimeout(() => noBtn.style.transform = 'translateX(0)', 240);

    setTimeout(() => {
      const maxX = window.innerWidth - 170;
      const maxY = window.innerHeight - 70;
      noBtn.style.position = 'fixed';
      noBtn.style.left = Math.max(10, Math.random()*maxX) + 'px';
      noBtn.style.top = Math.max(10, Math.random()*maxY) + 'px';
      noBtn.style.zIndex = '9999';
    }, 300);
  }

  function handleReject() {
    rejects = rejects + 1;
    rejectText.style.display = 'inline-block';
    rejectText.innerHTML = "You rejected " + rejects + (rejects > 1 ? " times" : " time") + " 😔";
    message.innerHTML = messages[Math.min(rejects, messages.length - 1)];
    showReaction();
    moveButton();
    playMusic('sad');
  }

  noBtn.addEventListener('click', function(e) {
    e.preventDefault();
    handleReject();
  });
  noBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    handleReject();
  }, {passive: false});
  noBtn.addEventListener('mouseover', handleReject);

  function createConfetti() {
    const colors = ['#e91e63','#ff9a9e','#fbc2eb','#ffeb3b','#4caf50','#2196f3'];
    for (let i = 0; i < 120; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random()*100 + 'vw';
      conf.style.background = colors[Math.floor(Math.random()*colors.length)];
      conf.style.animationDuration = (Math.random()*2 + 2) + 's';
      conf.style.animationDelay = Math.random()*0.5 + 's';
      document.body.appendChild(conf);
      setTimeout(() => conf.remove(), 4000);
    }
  }

  yesBtn.addEventListener('click', () => {
    main.classList.add('hidden');
    love.classList.remove('hidden');
    playMusic('romantic');

    if (rejects <= 2) {
      loveTitle.innerHTML = "I Love You So Much 💕";
      loveMessage.innerHTML = `Timro muskan nai mero happiness ho.<br>Ma afno galti accept garchu.<br>Please risai narakha na baby.<br><br><strong>Forever yours ❤️</strong>`;
    } else if (rejects <= 6) {
      loveTitle.innerHTML = "You made me wait... 🥺";
      loveMessage.innerHTML = `Jati choti reject gare pani maile wait gare.<br>Thank you for finally forgiving me.<br>I love you more than anything 💕<br><br><strong>Forever yours ❤️</strong>`;
    } else {
      loveTitle.innerHTML = "You really tested me 😭";
      loveMessage.innerHTML = rejects + ` times reject gareu... tara maile give up garina.<br>That's how much I love you.<br>Please don't make me wait again 🥺❤️<br><br><strong>Forever & Always yours</strong>`;
    }

    createConfetti();

    for (let i = 0; i < 60; i++) {
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = heartStyles[Math.floor(Math.random()*heartStyles.length)];
        heart.style.left = Math.random()*100 + 'vw';
        heart.style.fontSize = (Math.random()*20 + 16) + 'px';
        heart.style.animationDuration = (Math.random()*3 + 2) + 's';
        heartsBg.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }, i * 60);
    }
  });
</script>
</body>
</html>
