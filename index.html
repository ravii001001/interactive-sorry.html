<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For My Love ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
    transition: background 1s ease;
  }
  body.level-2 { background: linear-gradient(135deg, #ff8a80, #f48fb1, #e1bee7); }
  body.level-3 { background: linear-gradient(135deg, #e57373, #f06292, #ba68c8); }
  body.level-4 { background: linear-gradient(135deg, #c62828, #ad1457, #6a1b9a); }
  body.last-warning { background: linear-gradient(135deg, #4a148c, #311b92, #1a237e); }

  body.heartbeat-pulse {
    animation: screenPulse 0.7s ease;
  }
  @keyframes screenPulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.015); }
    60% { transform: scale(0.99); }
    100% { transform: scale(1); }
  }

  .hearts-bg, .balloons-bg, .quotes-bg {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 1; overflow: hidden;
  }
  .heart, .balloon, .broken-heart, .quote, .particle {
    position: absolute;
    animation: fall linear infinite;
    opacity: 0.8;
  }
  .balloon {
    font-size: 13px; font-weight: 600;
    color: #e91e63;
    background: rgba(255,255,255,0.7);
    padding: 4px 10px;
    border-radius: 20px;
  }
  .broken-heart { font-size: 22px; opacity: 0.9; }
  .quote {
    font-size: 13px;
    color: #ad1457;
    background: rgba(255,255,255,0.75);
    padding: 6px 12px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .particle {
    font-size: 14px;
    pointer-events: none;
    animation: particleFade 1s forwards;
  }
  @keyframes particleFade {
    0% { transform: scale(1); opacity: 0.9; }
    100% { transform: scale(0.3) translateY(-30px); opacity: 0; }
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.85; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .container {
    text-align: center;
    background: rgba(255,255,255,0.97);
    padding: 26px 18px;
    border-radius: 28px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    max-width: 400px; width: 100%;
    position: relative; z-index: 10;
    transition: all 0.4s ease;
  }
  body.last-warning .container {
    background: rgba(255,255,255,0.92);
    box-shadow: 0 0 30px rgba(233,30,99,0.4);
  }

  .photos {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .photo {
    width: 110px; height: 110px;
    border-radius: 50%; object-fit: cover;
    border: 4px solid #e91e63;
    box-shadow: 0 8px 20px rgba(233,30,99,0.3);
    animation: heartbeat 1.5s ease-in-out infinite;
    transition: transform 0.3s ease;
    cursor: pointer;
  }
  .photo:hover {
    transform: scale(1.25);
    z-index: 20;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  h1 { color: #e91e63; font-size: 22px; margin-bottom: 10px; }
  #message {
    color: #444; font-size: 15px;
    margin-bottom: 10px; line-height: 1.55; min-height: 52px;
  }
  .typing {
    color: #e91e63;
    font-style: italic;
    font-size: 14px;
  }
  #rejectText, .guilt-counter, .timer-counter {
    background: #ffe6ee;
    color: #e91e63;
    font-size: 14px; font-weight: 700;
    padding: 7px 16px; border-radius: 50px;
    margin: 6px 4px;
    display: inline-block;
  }
  .guilt-counter { background: #fce4ec; }
  .timer-counter { background: #f3e5f5; }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  button {
    padding: 12px 22px; font-size: 15px;
    border: none; border-radius: 50px;
    cursor: pointer; font-weight: 600;
    color: white; background: #e91e63;
    transition: all 0.3s ease;
    user-select: none;
  }
  button:hover { background: #c2185b; }
  #yes { box-shadow: 0 0 15px rgba(233,30,99,0.4); }
  #yes.growing { animation: pulse 1.4s infinite; }
  #oneMore {
    background: #7b1fa2;
    display: none;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }
  #no { position: relative; z-index: 20; }
  .hidden { display: none !important; }

  .reaction {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 60px; z-index: 9999;
    pointer-events: none;
    animation: pop 1.2s ease forwards;
  }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    30%  { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
    70%  { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -65%) scale(0.6); opacity: 0; }
  }
  .confetti {
    position: fixed;
    width: 10px; height: 10px;
    top: -10px;
    z-index: 999;
    animation: confettiFall 3s linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
  .last-warning-text {
    color: #c62828;
    font-weight: 800;
    font-size: 16px;
    margin: 8px 0;
    display: none;
  }

  /* Polaroid */
  .polaroid {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-6deg) scale(0);
    background: white;
    padding: 12px 12px 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    z-index: 10000;
    text-align: center;
    animation: polaroidIn 0.5s forwards;
  }
  .polaroid img {
    width: 180px;
    height: 180px;
    object-fit: cover;
    display: block;
    background: #f5f5f5;
  }
  .polaroid p {
    margin-top: 10px;
    font-size: 13px;
    color: #555;
    font-family: Georgia, serif;
  }
  @keyframes polaroidIn {
    to { transform: translate(-50%, -50%) rotate(-6deg) scale(1); }
  }
  .polaroid.hide {
    animation: polaroidOut 0.5s forwards;
  }
  @keyframes polaroidOut {
    to { transform: translate(-50%, -50%) rotate(8deg) scale(0); opacity: 0; }
  }

  /* Secret Button */
  .secret-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: 22px;
    cursor: pointer;
    z-index: 100;
    opacity: 0.5;
    transition: 0.3s;
    user-select: none;
  }
  .secret-btn:hover { opacity: 1; transform: scale(1.2); }

  /* Write your own sorry */
  #customSorry {
    display: none;
    margin: 12px 0;
  }
  #customSorry textarea {
    width: 100%;
    height: 70px;
    border: 2px solid #e91e63;
    border-radius: 12px;
    padding: 10px;
    font-size: 14px;
    resize: none;
  }

  /* Love Letter + Promise */
  .love-letter, .promise-card {
    background: #fffdf7;
    border: 1px solid #f0e6d0;
    padding: 20px;
    border-radius: 12px;
    text-align: left;
    font-family: 'Segoe Script', 'Comic Sans MS', cursive;
    font-size: 15px;
    line-height: 1.7;
    color: #444;
    max-height: 340px;
    overflow-y: auto;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.03);
  }
  .promise-card {
    text-align: center;
    border: 2px dashed #e91e63;
    font-family: Georgia, serif;
  }

  /* Compliment */
  .compliment {
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: rgba(255,255,255,0.95);
    color: #ad1457;
    padding: 12px 20px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 600;
    z-index: 9999;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    animation: complimentIn 0.5s forwards;
  }
  @keyframes complimentIn {
    to { transform: translateX(-50%) scale(1); }
  }
</style>
</head>
<body>

  <div class="hearts-bg" id="heartsBg"></div>
  <div class="balloons-bg" id="balloonsBg"></div>
  <div class="quotes-bg" id="quotesBg"></div>

  <div class="secret-btn" id="secretBtn">💖</div>

  <audio id="sadMusic" loop>
    <source src="https://raw.githubusercontent.com/ravii001001/interactive-sorry.html/main/voicee.mp3" type="audio/mpeg">
  </audio>
  <audio id="romanticMusic" loop>
    <source src="" type="audio/mpeg">
  </audio>

  <div class="container" id="main">
    <div class="photos">
      <img src="https://raw.githubusercontent.com/ravii001001/interactive-sorry.html/main/shreya.jpeg" class="photo" alt="Her">
      <img src="https://raw.githubusercontent.com/ravii001001/interactive-sorry.html/main/ravi.jpeg" class="photo" alt="Him">
    </div>
    <h1 id="mainTitle">Baby... 🥺</h1>
    <p id="message">Maile galti gare, maaf gara na.<br>Timi risako dekhera mann dukhiraxa.</p>

    <div id="rejectText" style="display:none;"></div>
    <div class="guilt-counter" id="guiltCounter" style="display:none;"></div>
    <div class="timer-counter" id="timerCounter" style="display:none;"></div>
    <div class="last-warning-text" id="lastWarning">⚠️ This is really hurting me...</div>

    <div id="customSorry">
      <textarea id="customText" placeholder="Write your own message here..."></textarea>
    </div>

    <div class="buttons">
      <button id="yes">Sorry accepted❤️</button>
      <button id="no">Sorry not accepted</button>
     <button id="oneMore">One More Chance💜</button>
    </div>
  </div>

  <div class="container hidden" id="love">
    <h1 id="loveTitle">I Love You So Much 💕</h1>
    <div id="loveMessage" class="love-letter"></div>
    <div id="promiseCard" class="promise-card" style="margin-top:15px; display:none;"></div>
  </div>

<script>
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const oneMoreBtn = document.getElementById('oneMore');
  const main = document.getElementById('main');
  const love = document.getElementById('love');
  const message = document.getElementById('message');
  const rejectText = document.getElementById('rejectText');
  const guiltCounter = document.getElementById('guiltCounter');
  const timerCounter = document.getElementById('timerCounter');
  const heartsBg = document.getElementById('heartsBg');
  const balloonsBg = document.getElementById('balloonsBg');
  const quotesBg = document.getElementById('quotesBg');
  const sadMusic = document.getElementById('sadMusic');
  const romanticMusic = document.getElementById('romanticMusic');
  const loveTitle = document.getElementById('loveTitle');
  const loveMessage = document.getElementById('loveMessage');
  const promiseCard = document.getElementById('promiseCard');
  const lastWarning = document.getElementById('lastWarning');
  const mainTitle = document.getElementById('mainTitle');
  const customSorry = document.getElementById('customSorry');
  const customText = document.getElementById('customText');
  const secretBtn = document.getElementById('secretBtn');

  let rejects = 0;
  let isTyping = false;
  let startTime = null;
  let timerInterval = null;
  let secretClicks = 0;
  let oneMoreUsed = false;

  const messages = [
    "Maile galti gare, maaf gara na.<br>Timi risako dekhera mann dukhiraxa.",
    "Please forgive me baby 🥺<br>Maile timilai dukha diyeko maile maaf chahanchu.",
    "I'm really sorry... 💔<br>Timro mann dukhauna maile chahena.",
    "Maile galti gare, sachi ma 😭<br>Please ek choti maaf gara na.",
    "Timi bina ma incomplete chu 😢<br>Please risai narakha na.",
    "Jati choti reject garda pani<br>maile sorry nai bhanirahanchu 🥺",
    "Baby please... maaf gara na 💔<br>Ma feri galti gardina.",
    "Timro muskan nai mero happiness ho.<br>Please forgive me 😢",
    "Last time... please maaf gara 😭❤️",
    "Maile sabai galti accept garchu.<br>Please ek chance deu na 🥺",
    "Yo reject le mero mann dherai dukhiraxa 😭",
    "Please... ma afno galti bujhechu 💔"
  ];

  const memories = [
    { img: "https://raw.githubusercontent.com/ravii001001/interactive-sorry.html/main/shreya.jpeg", text: "Remember this smile? 🥺" },
    { img: "https://raw.githubusercontent.com/ravii001001/interactive-sorry.html/main/ravi.jpeg", text: "Us against the world..." },
    { img: "https://raw.githubusercontent.com/ravii001001/interactive-sorry.html/main/shreya.jpeg", text: "That day was special ❤️" },
    { img: "https://raw.githubusercontent.com/ravii001001/interactive-sorry.html/main/ravi.jpeg", text: "I miss this version of us" }
  ];

  const loveQuotes = [
    "You are my today and all of my tomorrows",
    "In your smile I see something more beautiful than stars",
    "I love you more than words can express",
    "Every love story is beautiful, but ours is my favorite",
    "You are my home",
    "Forever isn’t long enough with you"
  ];

  const compliments = [
    "Timro aankha dherai beautiful cha ✨",
    "I miss your laugh so much 🥺",
    "You make everything better",
    "Timro smile nai mero favorite ho",
    "I still choose you every day"
  ];

  const reactions = ["💔😢","😭💔","💔🥺","😢💔😭","🖤😭","💔😩","😭🖤","💔😿","🥺💔"];
  const heartStyles = ["❤️","💖","💕","💗","💓","💘","💝","🖤","💔","✨"];
  const balloonTexts = ["I ❤️ You", "Sorry 🥺", "Maaf gara", "please shreyaa", "Forgive me", "Love you"];

  // Decorative hearts
  setInterval(() => {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = heartStyles[Math.floor(Math.random()*heartStyles.length)];
    heart.style.left = Math.random()*100 + 'vw';
    heart.style.fontSize = (Math.random()*12 + 14) + 'px';
    heart.style.animationDuration = (Math.random()*4 + 3) + 's';
    heartsBg.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }, 400);

  // Balloons
  setInterval(() => {
    const b = document.createElement('div');
    b.classList.add('balloon');
    b.innerHTML = balloonTexts[Math.floor(Math.random()*balloonTexts.length)];
    b.style.left = Math.random()*100 + 'vw';
    b.style.animationDuration = (Math.random()*5 + 4) + 's';
    balloonsBg.appendChild(b);
    setTimeout(() => b.remove(), 9000);
  }, 1300);

  // Floating Love Quotes
  setInterval(() => {
    const q = document.createElement('div');
    q.classList.add('quote');
    q.innerHTML = loveQuotes[Math.floor(Math.random()*loveQuotes.length)];
    q.style.left = Math.random()*80 + 10 + 'vw';
    q.style.animationDuration = (Math.random()*6 + 5) + 's';
    quotesBg.appendChild(q);
    setTimeout(() => q.remove(), 11000);
  }, 2800);

  // Soft Particle Trail
  document.addEventListener('mousemove', (e) => {
    if (Math.random() > 0.7) return;
    const p = document.createElement('div');
    p.className = 'particle';
    p.innerHTML = heartStyles[Math.floor(Math.random()*3)];
    p.style.left = e.clientX + 'px';
    p.style.top = e.clientY + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  });

  // Random Compliment
  setInterval(() => {
    if (Math.random() > 0.4) return;
    const c = document.createElement('div');
    c.className = 'compliment';
    c.innerHTML = compliments[Math.floor(Math.random()*compliments.length)];
    document.body.appendChild(c);
    setTimeout(() => {
      c.style.opacity = '0';
      c.style.transition = '0.5s';
      setTimeout(() => c.remove(), 500);
    }, 2500);
  }, 8000);

  function playMusic(type) {
    sadMusic.pause();
    romanticMusic.pause();
    if (type === 'sad') {
      sadMusic.currentTime = 0;
      sadMusic.volume = Math.max(0.15, 0.45 - (rejects * 0.03));
      sadMusic.play().catch(()=>{});
    } else {
      romanticMusic.currentTime = 0;
      romanticMusic.volume = 0.5;
      romanticMusic.play().catch(()=>{});
    }
  }

  function showReaction(emoji = null) {
    const el = document.createElement('div');
    el.className = 'reaction';
    el.innerHTML = emoji || reactions[Math.floor(Math.random()*reactions.length)];
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }

  function spawnBrokenHearts(count = 8) {
    for (let i = 0; i < count; i++) {
      const h = document.createElement('div');
      h.className = 'broken-heart';
      h.innerHTML = "💔";
      h.style.left = Math.random()*100 + 'vw';
      h.style.fontSize = (Math.random()*16 + 18) + 'px';
      h.style.animationDuration = (Math.random()*3 + 2.5) + 's';
      heartsBg.appendChild(h);
      setTimeout(() => h.remove(), 5500);
    }
  }

  function moveButton() {
    noBtn.style.transition = '0.08s';
    noBtn.style.transform = 'translateX(-10px)';
    setTimeout(() => noBtn.style.transform = 'translateX(10px)', 70);
    setTimeout(() => noBtn.style.transform = 'translateX(-6px)', 140);
    setTimeout(() => noBtn.style.transform = 'translateX(0)', 210);

    setTimeout(() => {
      const maxX = window.innerWidth - 160;
      const maxY = window.innerHeight - 70;
      noBtn.style.position = 'fixed';
      noBtn.style.left = Math.max(8, Math.random() * maxX) + 'px';
      noBtn.style.top = Math.max(8, Math.random() * maxY) + 'px';
      noBtn.style.zIndex = '9999';
    }, 280);
  }

  function updateYesSize() {
    const scale = 1 + Math.min(rejects * 0.07, 0.65);
    yesBtn.style.transform = `scale(${scale})`;
    yesBtn.classList.add('growing');
    if (rejects >= 8) yesBtn.innerHTML = "Please accept 🥺❤️";
    if (rejects >= 12) yesBtn.innerHTML = "Maaf gara na 😭";
  }

  function updateIntensity() {
    document.body.classList.remove('level-2','level-3','level-4','last-warning');
    lastWarning.style.display = 'none';
    customSorry.style.display = 'none';
    oneMoreBtn.style.display = 'none';

    if (rejects >= 12) {
      document.body.classList.add('last-warning');
      lastWarning.style.display = 'block';
      customSorry.style.display = 'block';
      if (!oneMoreUsed) oneMoreBtn.style.display = 'inline-block';
      mainTitle.innerHTML = "Please... 😭";
    } else if (rejects >= 8) {
      document.body.classList.add('level-4');
      mainTitle.innerHTML = "It hurts... 💔";
    } else if (rejects >= 5) {
      document.body.classList.add('level-3');
      mainTitle.innerHTML = "Baby please... 🥺";
    } else if (rejects >= 3) {
      document.body.classList.add('level-2');
    }
  }

  function startTimer() {
    if (!startTime) {
      startTime = Date.now();
      timerCounter.style.display = 'inline-block';
      timerInterval = setInterval(() => {
        const seconds = Math.floor((Date.now() - startTime) / 1000);
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        timerCounter.innerHTML = "⏱️ Rejecting for " + (mins > 0 ? mins + "m " : "") + secs + "s";
      }, 1000);
    }
  }

  function showPolaroid() {
    const mem = memories[Math.floor(Math.random() * memories.length)];
    const div = document.createElement('div');
    div.className = 'polaroid';
    div.innerHTML = `
      <img src="${mem.img}" alt="memory" onerror="this.src='https://via.placeholder.com/180x180/ff9a9e/ffffff?text=Memory+❤️'">
      <p>${mem.text}</p>
    `;
    document.body.appendChild(div);
    setTimeout(() => {
      div.classList.add('hide');
      setTimeout(() => div.remove(), 500);
    }, 2200);
  }

  function tryReverseReject() {
    if (rejects >= 7 && Math.random() < 0.35) {
      noBtn.innerHTML = "I can't say no... 🥺";
      noBtn.style.background = "#f48fb1";
      setTimeout(() => {
        noBtn.innerHTML = "Sorry not accepted";
        noBtn.style.background = "#e91e63";
      }, 2000);
    }
  }

  // Secret Button
  secretBtn.addEventListener('click', () => {
    secretClicks++;
    if (secretClicks >= 5) {
      secretClicks = 0;
      alert("Secret unlocked 💖\n\nI love you more than you know...\nEven when you reject me, I still choose you.");
    }
  });

  // One More Chance
  oneMoreBtn.addEventListener('click', () => {
    oneMoreUsed = true;
    oneMoreBtn.style.display = 'none';
    rejects = Math.max(0, rejects - 4);
    updateIntensity();
    updateYesSize();
    message.innerHTML = "Thank you for giving me one more chance 🥺❤️";
    showReaction("💜");
  });

  // Exit Intent
  document.addEventListener('mouseleave', (e) => {
    if (e.clientY < 10 && rejects > 3) {
      showReaction("Please don't leave 💔");
    }
  });

  function handleReject() {
    if (isTyping) return;
    rejects++;
    startTimer();

    document.body.classList.add('heartbeat-pulse');
    setTimeout(() => document.body.classList.remove('heartbeat-pulse'), 700);

    isTyping = true;
    message.innerHTML = `<span class="typing">Baby is typing...</span>`;
    
    setTimeout(() => {
      const msgIndex = Math.min(rejects, messages.length - 1);
      message.innerHTML = messages[msgIndex];
      isTyping = false;

      rejectText.style.display = 'inline-block';
      rejectText.innerHTML = "You rejected " + rejects + (rejects > 1 ? " times" : " time") + " 😔";

      guiltCounter.style.display = 'inline-block';
      guiltCounter.innerHTML = "💔 You broke my heart " + rejects + " times";

      showReaction();
      spawnBrokenHearts(rejects > 6 ? 14 : 8);
      moveButton();
      playMusic('sad');
      updateYesSize();
      updateIntensity();
      tryReverseReject();

      if (rejects % 3 === 0) {
        setTimeout(showPolaroid, 600);
      }
    }, 1200 + Math.random() * 600);
  }

  noBtn.addEventListener('click', function(e) {
    e.preventDefault();
    handleReject();
  });
  noBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    handleReject();
  }, {passive: false});
  noBtn.addEventListener('mouseover', handleReject);

  function createConfetti() {
    let colors;
    if (rejects >= 12) colors = ['#4a148c','#311b92','#7b1fa2','#e91e63'];
    else if (rejects >= 8) colors = ['#c62828','#ad1457','#e91e63','#ff5252'];
    else colors = ['#e91e63','#ff9a9e','#fbc2eb','#ffeb3b','#4caf50','#2196f3'];

    for (let i = 0; i < 160; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random()*100 + 'vw';
      conf.style.background = colors[Math.floor(Math.random()*colors.length)];
      conf.style.width = (Math.random()*10 + 6) + 'px';
      conf.style.height = conf.style.width;
      conf.style.animationDuration = (Math.random()*2.5 + 2) + 's';
      conf.style.animationDelay = Math.random()*0.6 + 's';
      document.body.appendChild(conf);
      setTimeout(() => conf.remove(), 4500);
    }
  }

  function typeLoveLetter(text, element) {
    element.innerHTML = "";
    let i = 0;
    function type() {
      if (i < text.length) {
        if (text.charAt(i) === "<") {
          const close = text.indexOf(">", i);
          element.innerHTML += text.substring(i, close + 1);
          i = close + 1;
        } else {
          element.innerHTML += text.charAt(i);
          i++;
        }
        setTimeout(type, 22);
      }
    }
    type();
  }

  yesBtn.addEventListener('click', () => {
    if (timerInterval) clearInterval(timerInterval);

    main.classList.add('hidden');
    love.classList.remove('hidden');
    playMusic('romantic');

    let letter = "";
    const userMessage = customText.value.trim();

    if (rejects <= 2) {
      loveTitle.innerHTML = "I Love You So Much 💕";
      letter = `My dearest,<br><br>
Timro muskan nai mero happiness ho.<br>
Ma afno galti accept garchu.<br>
Please risai narakha na baby.<br><br>
I promise to love you better every single day.<br>
You are my home, my peace, my everything.<br><br>
<strong>Forever yours ❤️</strong>`;
    } else if (rejects <= 6) {
      loveTitle.innerHTML = "You made me wait... 🥺";
      letter = `Baby,<br><br>
Jati choti reject gare pani maile wait gare.<br>
Thank you for finally forgiving me.<br>
I love you more than anything in this world.<br><br>
I know I hurt you, and I’m truly sorry.<br>
From now on, I’ll try my best to make you smile every day.<br><br>
<strong>Forever yours ❤️</strong>`;
    } else if (rejects <= 11) {
      loveTitle.innerHTML = "You really tested me 😭";
      letter = `My love,<br><br>
${rejects} times reject gareu... tara maile give up garina.<br>
That’s how much I love you.<br><br>
Please don’t make me wait again.<br>
I need you. I choose you. Every single time.<br><br>
<strong>Forever & Always yours 💕</strong>`;
    } else {
      loveTitle.innerHTML = "Finally... 😭❤️";
      letter = `My everything,<br><br>
Timi le ${rejects} choti reject garyau...<br>
Tara maile hareko chaina.<br>
Because I love you more than my ego.<br><br>
Now please stay with me forever.<br>
I don’t want a life without you.<br><br>
<strong>Now and always, I’m yours 💕</strong>`;
    }

    if (userMessage) {
      letter += `<br><br><em>Your message: "${userMessage}"</em>`;
    }

    typeLoveLetter(letter, loveMessage);

    setTimeout(() => {
      promiseCard.style.display = 'block';
      promiseCard.innerHTML = `
        <h3 style="color:#e91e63; margin-bottom:10px;">💌 My Promise to You</h3>
        I promise to never hurt you again.<br>
        I promise to choose you every day.<br>
        I promise to love you better than yesterday.<br><br>
        <strong>— Forever Yours</strong>
      `;
    }, 2500);

    createConfetti();

    for (let i = 0; i < 90; i++) {
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = heartStyles[Math.floor(Math.random()*heartStyles.length)];
        heart.style.left = Math.random()*100 + 'vw';
        heart.style.fontSize = (Math.random()*26 + 16) + 'px';
        heart.style.animationDuration = (Math.random()*3 + 2) + 's';
        heartsBg.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }, i * 40);
    }
  });
</script>
</body>
</html>
